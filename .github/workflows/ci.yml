name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: bash syntax
        run: bash -n install.sh
      - name: Refuses to install without permission
        run: |
          set -euo pipefail
          if ./install.sh >installer.log 2>&1; then
            echo "expected the installer to fail without sudo"
            cat installer.log
            exit 1
          fi
          grep -q "sudo" installer.log
          test ! -e /usr/local/bin/uniservice
      - name: Installs to the default prefix with sudo
        run: |
          set -euo pipefail
          sudo ./install.sh
          trap 'sudo ./install.sh --uninstall || true' EXIT
          command -v uniservice
          uniservice --version
          uniservice list
          test -f /usr/local/lib/uniservice/install.json
          sudo ./install.sh --uninstall
          test ! -e /usr/local/bin/uniservice
          trap - EXIT
      - name: Install and uninstall round trip into a custom prefix
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)/uniservice"
          ./install.sh --prefix "$prefix"
          "$prefix/bin/uniservice" --version
          "$prefix/bin/uniservice" list
          python - "$prefix/lib/uniservice/install.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["version"], data
          assert len(data["sha256"]) == 64, data
          assert data["files"], data
          assert "profile_files" not in data, data
          print("manifest OK:", data["version"], data["sha256"][:12])
          PY
          ./install.sh --uninstall --prefix "$prefix"
          test ! -e "$prefix/bin/uniservice"

  powershell:
    name: Installer script (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install-windows.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install-windows.ps1'), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $detail = ($errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }) -join "`n"
            $encoded = $detail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            [Console]::WriteLine("::error title=install-windows.ps1 syntax::$encoded")
            [Console]::Out.Flush()
            exit 1
          }
          Write-Host 'install-windows.ps1 parses cleanly'
      - name: Exercise the installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          # Job logs need repository admin rights to download, so failures are
          # reported through check annotations instead.  [Console]::WriteLine is
          # used because Write-Host output is not parsed as a workflow command.
          function Write-Annotation {
            param([string]$Title, [string]$Detail)
            $encoded = $Detail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            [Console]::WriteLine("::error title=$Title::$encoded")
            [Console]::Out.Flush()
          }

          function Invoke-InstallerScript {
            param([string[]]$InstallerArgs)
            Write-Host ">>> install-windows.ps1 $($InstallerArgs -join ' ')"
            $output = & pwsh -NoProfile -File ./install-windows.ps1 @InstallerArgs 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $output
            if ($code -ne 0) {
              Write-Annotation -Title 'install-windows.ps1' -Detail "exit code $code`n$output"
              throw "install-windows.ps1 exited $code"
            }
          }

          try {
            Invoke-InstallerScript @('-Uninstall', '-Prefix', (Join-Path $env:RUNNER_TEMP 'uniservice-none')) | Out-Null

            $prefix = Join-Path $env:RUNNER_TEMP 'uniservice-test'
            Invoke-InstallerScript @('-Prefix', $prefix, '-NoModifyPath') | Out-Null

            $shim = Join-Path $prefix 'bin\uniservice.cmd'
            if (-not (Test-Path -LiteralPath $shim)) { throw "missing $shim" }
            & $shim --version
            if ($LASTEXITCODE -ne 0) { throw "uniservice.cmd --version returned $LASTEXITCODE" }

            $data = Get-Content -LiteralPath (Join-Path $prefix 'install.json') -Raw | ConvertFrom-Json
            if (-not $data.version) { throw 'the manifest has no version' }
            Write-Host "manifest version: $($data.version), files: $($data.files.Count)"

            Invoke-InstallerScript @('-Uninstall', '-Prefix', $prefix) | Out-Null
            if (Test-Path -LiteralPath $prefix) { throw "uninstall left $prefix behind" }
            Write-Host 'portable install/uninstall round trip OK'
          } catch {
            Write-Annotation -Title 'windows installer' -Detail ($_ | Out-String)
            throw
          }

          exit 0

  package:
    name: Package (zipapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build twice and compare
        run: |
          set -euo pipefail
          python scripts/build_zipapp.py --output build/a/uniservice
          python scripts/build_zipapp.py --output build/b/uniservice
          cmp build/a/uniservice build/b/uniservice
          echo "the zipapp build is reproducible"
      - name: Smoke test the artifact
        run: |
          set -euo pipefail
          build/a/uniservice --version
          build/a/uniservice list
          test -x build/a/uniservice

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show the installed version
        run: uniservice --version
      - name: Run the test suite
        run: python .github/scripts/run_tests.py -v
