name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

  zipapp:
    name: Package (zipapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build twice and compare
        run: |
          set -euo pipefail
          python scripts/build_zipapp.py --output build/a/uniservice
          python scripts/build_zipapp.py --output build/b/uniservice
          cmp build/a/uniservice build/b/uniservice
          echo "the zipapp build is reproducible"
      - name: Smoke test the artifact
        run: |
          set -euo pipefail
          build/a/uniservice --version
          build/a/uniservice list
          test -x build/a/uniservice

  package:
    name: Package (PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the metadata that PyPI will render
        run: |
          set -euo pipefail
          if ! log="$(twine check dist/* 2>&1)"; then
            printf '%s\n' "$log" >&2
            python3 - "$log" <<'PY'
          import sys
          import urllib.parse

          print("::error title=twine check failed::" + urllib.parse.quote(sys.argv[1], safe=""))
          PY
            exit 1
          fi
          printf '%s\n' "$log"
      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          # pipx and uv install the wheel, not the checkout, so this is the only
          # place the console script is exercised the way a user gets it.
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install dist/*.whl
          test -x venv/bin/uniservice
          venv/bin/uniservice --version
          venv/bin/uniservice list
          venv/bin/python -c "import uniservice_lib, uniservice_lib.backends.linux"

  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Install binutils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Build the standalone binary
        run: python scripts/build_binary.py --output-dir dist
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          dist/uniservice-* --version
          dist/uniservice-* list
      - name: Install it with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)/uniservice"
          ./install.sh --prefix "$prefix" --from dist/uniservice-*
          "$prefix/bin/uniservice" --version
          # The command removes itself; on Linux unlinking a running image is fine.
          "$prefix/bin/uniservice" self uninstall
          test ! -e "$prefix"
      - name: Install it with install-windows.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $prefix = Join-Path $env:RUNNER_TEMP 'uniservice-binary'
            $artifact = (Get-ChildItem dist\uniservice-*.exe).FullName
            ./install-windows.ps1 -From $artifact -Prefix $prefix -NoModifyPath
            $manifest = Join-Path $prefix 'lib\uniservice\manifest'
            if (-not (Test-Path -LiteralPath $manifest)) { throw "the manifest is not at $manifest" }
            $exe = Join-Path $prefix 'bin\uniservice.exe'
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw "$exe --version exited $LASTEXITCODE" }

            # A running image cannot delete itself on Windows: the manifest and
            # the empty directories go immediately, and the .exe is handed to a
            # helper that runs once this process is gone.
            $output = & $exe self uninstall 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE`n$output" }
            if ($output -notmatch 'a moment after this command exits') {
              throw "expected the deferred message, got:`n$output"
            }
            $deadline = (Get-Date).AddSeconds(20)
            while ((Test-Path -LiteralPath $prefix) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Test-Path -LiteralPath $prefix) { throw "uninstall left $prefix behind`n$output" }
            Write-Host 'standalone binary install/self-uninstall OK'
          } catch {
            $message = ($_ | Out-String).Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            [Console]::WriteLine("::error title=windows binary install::$message")
            [Console]::Out.Flush()
            throw
          }
      - name: Self-uninstall the portable zipapp on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A .pyz is not a mapped image, so the recommended install removes
          # itself with no helper at all.
          try {
            $prefix = Join-Path $env:RUNNER_TEMP 'uniservice-zipapp'
            python scripts/build_zipapp.py --output build/uniservice --quiet
            ./install-windows.ps1 -From "$PWD/build/uniservice" -Prefix $prefix -NoModifyPath
            if (-not (Test-Path -LiteralPath (Join-Path $prefix 'lib\uniservice\manifest'))) {
              throw 'the manifest is not under lib\uniservice'
            }
            $shim = Join-Path $prefix 'bin\uniservice.cmd'
            & $shim --version
            # The .cmd shim is being read by cmd.exe and the .pyz is the script
            # `py` is running, so both are handed to the helper; what matters is
            # that the prefix is gone once it has run.
            $output = & $shim self uninstall 2>&1 | Out-String
            Write-Host $output
            if ($output -notmatch 'a moment after this command exits') {
              throw "expected the deferred message, got:`n$output"
            }
            $deadline = (Get-Date).AddSeconds(20)
            while ((Test-Path -LiteralPath $prefix) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (Test-Path -LiteralPath $prefix) { throw "uninstall left $prefix behind`n$output" }
            Write-Host 'portable zipapp self-uninstall OK'
          } catch {
            $message = ($_ | Out-String).Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            [Console]::WriteLine("::error title=windows zipapp uninstall::$message")
            [Console]::Out.Flush()
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/uniservice-*
          if-no-files-found: error

  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: bash syntax
        run: bash -n install.sh
      - name: Build the zipapp to install
        run: python scripts/build_zipapp.py --output build/uniservice --quiet
      - name: Refuses to install without permission
        run: |
          set -euo pipefail
          if ./install.sh >installer.log 2>&1; then
            echo "expected the installer to fail without sudo"
            cat installer.log
            exit 1
          fi
          grep -q "sudo" installer.log
          test ! -e /usr/local/bin/uniservice
      - name: Installs the recommended zipapp into /usr/local with sudo
        run: |
          set -euo pipefail
          sudo ./install.sh --from "$PWD/build/uniservice"
          trap 'sudo ./install.sh --uninstall 2>/dev/null || sudo uniservice self uninstall || true' EXIT
          command -v uniservice
          uniservice --version
          uniservice list
          test -f /usr/local/lib/uniservice/manifest
          grep -q '^kind=zipapp$' /usr/local/lib/uniservice/manifest
          # The normal way to undo this is now the command's own subcommand.
          sudo uniservice self uninstall
          test ! -e /usr/local/bin/uniservice
          trap - EXIT
      - name: Custom prefix round trip
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)/uniservice"
          ./install.sh --prefix "$prefix" --from "$PWD/build/uniservice"
          "$prefix/bin/uniservice" --version
          "$prefix/bin/uniservice" list
          grep -q '^schema=1$' "$prefix/lib/uniservice/manifest"
          ./install.sh --uninstall --prefix "$prefix"
          test ! -e "$prefix/bin/uniservice"

  powershell:
    name: Installer script (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install-windows.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install-windows.ps1'), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $detail = ($errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }) -join "`n"
            $encoded = $detail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            [Console]::WriteLine("::error title=install-windows.ps1 syntax::$encoded")
            [Console]::Out.Flush()
            exit 1
          }
          Write-Host 'install-windows.ps1 parses cleanly'
      - name: Uninstall with no manifest is handled
        shell: pwsh
        run: |
          ./install-windows.ps1 -Uninstall -Prefix (Join-Path $env:TEMP 'uniservice-does-not-exist')
          Write-Host 'uninstall without a manifest exits cleanly'
      - name: UNISERVICE_BINARY selects the standalone binary
        shell: pwsh
        run: |
          # `iwr ... | iex` cannot pass a switch, so the env var has to work. A
          # bogus version makes the failure message name the artifact it chose.
          $env:UNISERVICE_BINARY = '1'
          try {
            ./install-windows.ps1 -Prefix (Join-Path $env:RUNNER_TEMP 'nope') -Version v0.0.0-nonexistent -NoModifyPath
            throw 'expected the download to fail'
          } catch {
            if ("$_" -notmatch 'drop -Binary') {
              throw "expected the standalone-binary hint, got: $_"
            }
            Write-Host 'UNISERVICE_BINARY selected the standalone binary'
          } finally {
            Remove-Item Env:\UNISERVICE_BINARY -ErrorAction SilentlyContinue
          }

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Show the installed version
        run: uniservice --version
      - name: Run the test suite
        run: python .github/scripts/run_tests.py -v
      - name: Run the CLI tests under the system scope
        # Windows always derives the system scope, and its runners are the
        # slowest feedback loop; this repeats that derivation everywhere.
        run: python .github/scripts/run_tests.py -q -p tests.system_scope_plugin
