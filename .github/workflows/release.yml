name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the build tools
        run: python -m pip install --upgrade pip build
      - name: Build the wheel and the sdist
        run: python -m build
      - name: Build the single-file zipapp
        run: python scripts/build_zipapp.py --output dist/uniservice
      - name: Check the tag against the packaged version
        run: |
          set -euo pipefail
          version="$(dist/uniservice --version | awk '{print $2}')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::warning title=version mismatch::tag ${GITHUB_REF_NAME} but the artifact reports ${version}"
          fi
          echo "packaged version: ${version}"
      - name: Smoke test the artifact
        run: |
          set -euo pipefail
          dist/uniservice list
          test -x dist/uniservice
      - name: Write the checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum uniservice > uniservice.sha256
          sha256sum uniservice ./*.whl ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          publish() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber
            else
              gh release create "$tag" --title "$tag" --generate-notes dist/*
            fi
          }
          if ! log="$(publish 2>&1)"; then
            printf '%s\n' "$log" >&2
            # Job logs need repository admin rights to download, so report the
            # failure as a check annotation as well.
            python3 - "$log" <<'PY'
          import sys
          import urllib.parse

          print("::error title=gh release failed::" + urllib.parse.quote(sys.argv[1], safe=""))
          PY
            exit 1
          fi
          printf '%s\n' "$log"
