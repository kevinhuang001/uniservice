name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Install binutils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Build the standalone binary
        run: python scripts/build_binary.py --output-dir dist
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          dist/uniservice-* --version
          dist/uniservice-* list
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/uniservice-*
          if-no-files-found: error

  zipapp:
    name: Build zipapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the portable zipapp
        run: python scripts/build_zipapp.py --output dist/uniservice
      - name: Smoke test the zipapp
        run: |
          set -euo pipefail
          dist/uniservice --version
          dist/uniservice list
          test -x dist/uniservice
      - uses: actions/upload-artifact@v4
        with:
          name: zipapp
          path: dist/uniservice
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [binaries, zipapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the build tools
        run: python -m pip install --upgrade pip build
      - name: Build the wheel and the sdist
        run: python -m build
      - name: Collect every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true
      - name: Check the tag against the packaged version
        run: |
          set -euo pipefail
          ls -l dist
          # upload-artifact/download-artifact does not preserve file modes, so a
          # freshly collected zipapp is not executable yet.  (Release assets do
          # not carry a mode either, which is why install.sh chmods whatever it
          # downloads.)
          chmod +x dist/uniservice
          version="$(dist/uniservice --version | awk '{print $2}')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::warning title=version mismatch::tag ${GITHUB_REF_NAME} but the artifacts report ${version}"
          fi
          echo "packaged version: ${version}"
      - name: Write the checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # `uniservice-*` already covers the platform binaries, the wheel and the
          # sdist; listing them again would duplicate their lines.
          sha256sum uniservice uniservice-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          publish() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber
            else
              gh release create "$tag" --title "$tag" --generate-notes dist/*
            fi
          }
          if ! log="$(publish 2>&1)"; then
            printf '%s\n' "$log" >&2
            # Job logs need repository admin rights to download, so report the
            # failure as a check annotation as well.
            python3 - "$log" <<'PY'
          import sys
          import urllib.parse

          print("::error title=gh release failed::" + urllib.parse.quote(sys.argv[1], safe=""))
          PY
            exit 1
          fi
          printf '%s\n' "$log"
