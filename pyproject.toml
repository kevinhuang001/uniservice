[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniservice"
description = "Cross-platform service manager built on systemd, launchd and Scheduled Tasks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Huang", email = "kevinwong.yiming@outlook.com" }]
keywords = ["systemd", "launchd", "scheduled-tasks", "service-manager", "daemon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
# Building the standalone binaries: `python scripts/build_binary.py`. PyInstaller
# cannot cross-compile, so it has to run on each target OS/architecture.
build = ["pyinstaller>=6.0"]

[project.scripts]
uniservice = "uniservice_lib.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/kevinhuang001/uniservice"
Issues = "https://github.com/kevinhuang001/uniservice/issues"

[tool.setuptools.packages.find]
# Discovered rather than listed: a new subpackage that is forgotten here would
# ship a wheel whose console script cannot import it.
include = ["uniservice_lib*"]

[tool.setuptools.dynamic]
version = { attr = "uniservice_lib.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: exercises the real OS service manager (opt in with UNISERVICE_RUN_INTEGRATION=1)",
]

[tool.coverage.run]
branch = true
source = ["uniservice_lib"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["uniservice_lib"]
